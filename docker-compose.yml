services:
  db:
    image: mysql:8.0
    container_name: navidad_tvs_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: navidad_tvs_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('FS_METHOD', 'direct');
    volumes:
      - wp_data:/var/www/html
      # ---------------------------------------------------------------
      # El repo ES la carpeta del plugin, montada en vivo: editar un PHP
      # en el host se refleja al recargar, sin copiar nada.
      #
      # VA EN SOLO LECTURA, y no es un detalle. Al ser el mismo
      # directorio, pulsar "Eliminar" en Plugins borraba los archivos a
      # través del montaje y se llevaba el repositorio entero por
      # delante, .git incluido. Pasó el 29 de septiembre de 2026 y
      # costó dos commits.
      #
      # Con :ro el borrado falla y los archivos siguen ahí. WordPress
      # no necesita escribir dentro de la carpeta del plugin para nada;
      # lo único que se pierde es poder instalar el zip encima en el
      # WordPress local, que tampoco se hacía: para probar se edita el
      # archivo directamente.
      # ---------------------------------------------------------------
      - ./:/var/www/html/wp-content/plugins/navidad-tvs:ro
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    ports:
      - "8080:80"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: navidad_tvs_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"

  wpcli:
    image: wordpress:cli-php8.2
    container_name: navidad_tvs_cli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      # También de solo lectura: los scripts de dev/ solo leen.
      - ./:/var/www/html/wp-content/plugins/navidad-tvs:ro
    entrypoint: wp
    command: ["--info"]

volumes:
  db_data:
  wp_data:
